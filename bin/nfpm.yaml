name: "bclone"
arch: "{{.Arch}}"
platform: "linux"
version: "{{.Version}}"
section: "default"
priority: "extra"
provides:
- rclone
- bclone
- tclone
conflicts:
- rclone
replaces:
- rclone
maintainer: "BenjiThatFoxGuy"
description: |
  bclone - rclone fork with additional backends
    A fork of rclone with e621, telegram, gotohp, and other custom
    backends. Drop-in replacement for rclone.
vendor: "BenjiThatFoxGuy"
homepage: "https://github.com/BenjiThatFoxGuy/bclone"
license: "MIT"
contents:
  - src: ./bclone
    dst: /usr/bin/bclone
  - src: ./README.html
    dst: /usr/share/doc/bclone/README.html
  - src: ./README.txt
    dst: /usr/share/doc/bclone/README.txt
  - src: ./rclone.1
    dst: /usr/share/man/man1/bclone.1
  - dst: /usr/bin/rclone
    type: symlink
    src: /usr/bin/bclone
  - dst: /usr/bin/tclone
    type: symlink
    src: /usr/bin/bclone
